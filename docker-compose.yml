services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: atlas-nginx
    ports:
      - "${ATLAS_HTTPS_PORT:-443}:443"
      - "${ATLAS_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/certs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend:
    build: ./backend
    container_name: atlas-backend
    volumes:
      - atlas-data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - DATA_DIR=/data
      - PROMETHEUS_CONFIG_PATH=/data/prometheus.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: atlas-prometheus
    volumes:
      - atlas-data:/backend-data:ro
      - prometheus_data:/prometheus
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/backend-data/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas-data:
  prometheus_data:
